name = "penztarkonyv-dashboard-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Nem-titkos azonosítók (a database ID önmagában nem ad hozzáférést,
# csak a NOTION_TOKEN-nel együtt jelent bármit).
# FONTOS: ezeknek a Notion adatbázis (database) ID-nak kell lenniük, NEM a
# "data source" ID-nak — a kettő eltérő UUID az újabb Notion-adatmodellben,
# és a 2022-06-28-as Notion API verzió a database ID-t várja.
[vars]
DB_SZAMLAK = "75433ba302c34a02a22080a8ee14998f"
DB_TRANZAKCIOK = "a8c14e0a4e5043368da6036558638bca"
DB_NETWORTH = "f57d004241e8429c9c0dd82206a95aa4"
DB_HITELEK = "1459364c1e044aca8bef7d15f6627f3c"
DB_KESZPENZ = "fb8fcb11ec164933a60705b721f101aa"
DB_TEENDOK = "33348cc2b0714680a7c6a87605430404"

# Javasolt havi keretek (Ft) — a "mire ment" widget ezekhez méri a folyó
# havi Élelmiszer, illetve Vendéglátás/étkezés + Egyéb vásárlás/szolgáltatás
# kategóriák eddigi összegét. Írd át bátran a sajátodra.
BUDGET_FOOD_CAP = "360000"
BUDGET_FLEX_CAP = "245000"

# Heti összefoglaló push értesítés — https://ntfy.sh -on keresztül, API-kulcs
# vagy regisztráció nélkül. Ez NEM a valódi Notion/app titok, csak egy
# "csatornanév" — de mivel bárki, aki ismeri, feliratkozhat rá, válassz egy
# hosszú, kitalálhatatlan, senki más által nem használt sztringet (pl. egy
# jelszógenerátorral), NE hagyd az alapértéken.
#   1) telepítsd az "ntfy" appot a telefonodra (App Store / Play Store)
#   2) az appban iratkozz fel egy általad kitalált téma-névre
#   3) ugyanazt a nevet írd ide
NTFY_TOPIC = "REPLACE_WITH_YOUR_OWN_RANDOM_TOPIC"

# Mikor menjen ki a heti automatikus összefoglaló. A Cloudflare Cron Trigger
# mindig UTC-ben fut (nem igazodik a nyári/téli időszámításhoz) — ez az érték
# vasárnap 18:00 UTC-nek felel meg, ami magyar idő szerint nyáron 20:00,
# télen 19:00. Írd át, ha más időpontot szeretnél (crontab.guru segít).
# FONTOS: a Cloudflare a hét napjait 1(vasárnap)–7(szombat) szerint számozza,
# NEM a szokásos 0(vasárnap)–6(szombat) crontab-konvenció szerint — ezért itt
# a "SUN"/"MON"/... rövidítéseket használjuk, hogy elkerüljük a félreértést.
[triggers]
crons = ["0 18 * * SUN"]

# A NOTION_TOKEN és APP_TOKEN NEM ide kerül — azokat titokként kell
# beállítani (lásd README):
#   wrangler secret put NOTION_TOKEN
#   wrangler secret put APP_TOKEN
